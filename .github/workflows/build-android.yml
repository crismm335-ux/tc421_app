name: Build Android (APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Gerar o projeto Android
        run: |
          flutter create --project-name tc421_app --platforms=android --org br.fisionit .
          rm -f test/widget_test.dart
          # O app precisa de rede; a permissão vem só na versão de depuração por padrão.
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml

      - name: Baixar dependências
        run: flutter pub get

      # Os testes conferem os pacotes UDP. Se falharem, o APK ainda é gerado.
      - name: Testes dos pacotes
        continue-on-error: true
        run: flutter test

      - name: Compilar o APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: tc421-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
